    const out={};const L=lid(path0);
    for(let i=0;i<ids.length;i+=20){const part=ids.slice(i,i+20);
      const r=await gx('POST','/$batch',{requests:part.map((id,j)=>({id:String(j),method:'GET',url:`/sites/${SITE}/lists/${L}/items/${id}?$expand=fields($select=Key,Data,Stamp)&$select=id,eTag,createdBy,lastModifiedBy`}))});
      for(const x of r.responses||[]){if(x.status===200)out[x.body.id]=x.body;}}
    return out;}
  async function partsOf(path,n){let s='';for(let i=0;i<n;i++){const r=await gx('GET',`${itemsUrl(path)}?$expand=fields($select=Key,Data)&$filter=${encodeURIComponent(`fields/Key eq '${qv(path+'#'+i)}'`)}`,undefined,PREFER);const it=(r.value||[])[0];if(!it)throw new Error('나눠 저장한 조각을 찾지 못했어요: '+path);s+=it.fields?.Data||'';}return s;}
  async function decode(path,it){let raw=it.fields?.Data;if(raw==null||raw==='')return null;let v=JSON.parse(raw);if(v&&v.__p){v=JSON.parse(await partsOf(path,v.__p));}return v;}
  async function refresh(path0,coll,flt,key){
    const idx=await index(path0,coll,flt,key);const seen=new Set(),need=[];
    for(const it of idx){const p=it.fields?.Key;if(!p)continue;seen.add(p);const c=cache.get(p);const st=String(it.fields?.Stamp||'')+'|'+(it.eTag||'');if(!c||c.stamp!==st)need.push(it.id);}
    const full=need.length?await fullItems(path0,need):{};
    for(const it of idx){const p=it.fields?.Key;if(!p)continue;const f=full[it.id];if(!f)continue;
      try{const data=await decode(p,f);cache.set(p,{id:it.id,etag:f.eTag,stamp:String(f.fields?.Stamp||'')+'|'+(it.eTag||''),data,ok:trusted(p,f),parts:(()=>{try{const v=JSON.parse(f.fields?.Data||'null');return v&&v.__p||0;}catch{return 0;}})()});}
      catch(e){console.error('읽기 실패',p,e);}}
    // 사라진 항목
    for(const [p,ent] of [...cache]){if(seen.has(p))continue;if(key?p===key:match(p,ent,coll,flt))cache.delete(p);}
  }
  async function getOne(path){await refresh(path,null,null,path);return cache.get(path)||null;}

  /* ---------- 쓰기 ---------- */
  const chunks=s=>{const a=[];for(let i=0;i<s.length;i+=CH)a.push(s.slice(i,i+CH));return a;};
  const isDup=e=>e&&(e.status===409||/duplicate|중복|unique/i.test(e.message||''));
  function fieldsFor(path,data,main){const f={Title:path.slice(0,250),Key:path,Coll:collOf(path),Data:main,Stamp:Date.now()};
    if(data&&Number.isFinite(Number(data.yr))&&data.yr!==''&&data.yr!=null)f.Yr=Number(data.yr);
    const q=data&&(data.wk||data.ym);if(q)f.Q=String(q);return f;}
  async function findId(path){const r=await gx('GET',`${itemsUrl(path)}?$select=id,eTag&$expand=fields($select=Key)&$filter=${encodeURIComponent(`fields/Key eq '${qv(path)}'`)}`,undefined,PREFER);const it=(r.value||[])[0];return it?{id:it.id,etag:it.eTag}:null;}
  async function writeRaw(path,fields,createOnly,ifMatch){
    const c=cache.get(path);let id=c&&c.id;
    if(!id&&!createOnly){const f=await findId(path);id=f&&f.id;}
    if(id){await gx('PATCH',`${itemsUrl(path)}/${id}/fields`,fields,ifMatch?{headers:{'If-Match':ifMatch}}:{});return id;}
    try{const it=await gx('POST',itemsUrl(path),{fields});return it.id;}
    catch(e){if(isDup(e)&&!createOnly){const f=await findId(path);if(f){await gx('PATCH',`${itemsUrl(path)}/${f.id}/fields`,fields);return f.id;}}throw e;}}
  async function put(path,data,opt={}){
    const s=JSON.stringify(data);let main=s,parts=[];
    if(s.length>CH){parts=chunks(s);main=JSON.stringify({__p:parts.length});}
    const old=cache.get(path);const oldParts=old?.parts||0;
    for(let i=0;i<parts.length;i++){const pp=path+'#'+i;const pc=collOf(path)+'#';
      const pid=await writeRaw(pp,{Title:pp.slice(0,250),Key:pp,Coll:pc,Data:parts[i],Stamp:Date.now()},false);cache.set(pp,{id:pid,ok:false,data:null,stamp:'part'});}
    const id=await writeRaw(path,fieldsFor(path,data,main),!!opt.createOnly,opt.ifMatch);
    for(let i=parts.length;i<oldParts;i++){try{const f=await findId(path+'#'+i);if(f)await gx('DELETE',`${itemsUrl(path)}/${f.id}`);}catch(e){console.warn(e);}}
    cache.set(path,{id,etag:null,stamp:'local:'+Date.now(),data:JSON.parse(s),ok:true,parts:parts.length});
    emitAll();}
  const merge=(a,b)=>{for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))merge(a[k],b[k]);else a[k]=b[k];}return a;};
  async function update(path,partial){
    for(let t=0;t<4;t++){const ent=await getOne(path);if(!ent||ent.data==null){const e=new Error('문서가 없어요');e.code='invalid_argument';throw e;}
      const next=merge(JSON.parse(JSON.stringify(ent.data)),JSON.parse(JSON.stringify(partial)));
      try{await put(path,next,{ifMatch:ent.parts?undefined:ent.etag});return;}catch(e){if(e.status===412){await new Promise(r=>setTimeout(r,300+Math.random()*700));continue;}throw e;}}
    throw new Error('다른 사람이 동시에 고치고 있어요. 잠시 후 다시 해 주세요.');}
  async function del(path){const c=cache.get(path)||await findId(path);
    const n=c?.parts||0;for(let i=0;i<n;i++){try{const f=await findId(path+'#'+i);if(f)await gx('DELETE',`${itemsUrl(path)}/${f.id}`);}catch(e){console.warn(e);}}
    if(c&&c.id){try{await gx('DELETE',`${itemsUrl(path)}/${c.id}`);}catch(e){if(e.status!==404)throw e;}}
    cache.delete(path);emitAll();}

  /* ---------- OneDrive (개인 열람 키) ---------- */
  async function readDrive(path){
    let it;try{it=await gx('GET',path);}catch(e){if(e.status===404)return null;throw e;}
    const url=it['@microsoft.graph.downloadUrl'];let st='';
    if(url){try{const r=await fetch(url);if(r.ok)return await r.text();st='url '+r.status;}catch(e){st='url '+e.message;}}
    const drv=it.parentReference?.driveId;const cp=drv?`${G}/drives/${drv}/items/${it.id}/content`:`${G}${path}:/content`;
    const r=await fetch(cp,{headers:{Authorization:'Bearer '+await token()}});if(r.ok)return await r.text();
    throw Object.assign(new Error('download ('+st+' / content '+r.status+')'),{code:'graph'});}
  const keyPath=`/me/drive/root:/${KEYFILE}`;
  const keyDoc={
    async get(){const t=await readDrive(keyPath);return {id:'keys',exists:!!t,data:()=>t?JSON.parse(t):undefined};},
    async set(d){await gx('PUT',`${keyPath}:/content`,new Blob([JSON.stringify(d)],{type:'application/json'}));}};

  /* ---------- db ---------- */
  function poller(s){const run=async()=>{if(document.visibilityState==='hidden')return;try{await refresh(s.path0,s.coll,s.flt,s.key);emit(s);}catch(e){console.warn('새로 고침 실패',e);if(s.err&&e.code==='forbidden')s.err(e);}};
    run().then(()=>emit(s,true));s.timer=setInterval(run,POLL);return ()=>{clearInterval(s.timer);subs.delete(s);};}
  function query(coll,flt=[]){return {
    where(f,op,v){return query(coll,[...flt,[f,op,v]]);},orderBy(){return this;},limit(){return this;},
    async get(){await refresh(coll+'/x',coll,flt,null);const docs=[];for(const [p,ent] of cache)if(ent.ok&&ent.data!=null&&match(p,ent,coll,flt))docs.push(snapDoc(p,ent));return {docs,size:docs.length,empty:!docs.length};},
    onSnapshot(next,err){const s={path0:coll+'/x',coll,flt,key:null,cb:next,err,sig:null};subs.add(s);return poller(s);},
    doc(id){return doc(coll+'/'+(id||Math.random().toString(36).slice(2)));}};}
  function doc(path){
    if(/^data\/users\/[^/]+\/keys$/.test(path))return keyDoc;
    return {id:idOf(path),path,
      async get(){const ent=await getOne(path);return snapDoc(path,ent);},
      async set(d){if(d===undefined){const e=new Error('invalid');e.code='invalid_argument';throw e;}await put(path,JSON.parse(JSON.stringify(d)),{createOnly:path.startsWith('nos/')&&!cache.get(path)});},
      async update(p){await update(path,p);},
      async delete(){await del(path);},
      async acquire(){return {acquired:true};},
      onSnapshot(next,err){const s={path0:path,coll:null,flt:[],key:path,cb:next,err,sig:null};subs.add(s);return poller(s);},
      collection(c){return query(path+'/'+c);}};}
  const db={doc,collection:c=>query(c)};
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')for(const s of subs)refresh(s.path0,s.coll,s.flt,s.key).then(()=>emit(s)).catch(()=>{});});

  /* ---------- 사용자 ---------- */
  const PROF={};
  const user={
    async me(){return {id:ME.email,name:ME.name,canEdit:isAdm(ME.email)};},
    async can(){return true;},
    async id(){return ME.email;},
    async profiles(ids){const need=ids.filter(i=>i&&!PROF[i]&&/@/.test(i));
      for(let i=0;i<need.length;i+=20){const part=need.slice(i,i+20);
        try{const r=await gx('POST','/$batch',{requests:part.map((u,j)=>({id:String(j),method:'GET',url:`/users/${encodeURIComponent(u)}?$select=displayName,mail`}))});
          for(const x of r.responses||[]){const u=part[Number(x.id)];PROF[u]={id:u,name:x.status===200?(x.body.displayName||''):''};}}catch(e){console.warn(e);}}
      return Object.fromEntries(ids.map(i=>[i,PROF[i]||{id:i,name:''}]));}};

  /* ---------- 파일 (SharePoint 문서 라이브러리) ---------- */
  const assets={
    async upload(blob){
      const ext=/png/.test(blob.type)?'png':/jpe?g/.test(blob.type)?'jpg':/svg/.test(blob.type)?'svg':'bin';
      const name=`${new Date().getFullYear()}/${Date.now().toString(36)}${Math.random().toString(36).slice(2,10)}.${ext}`;
      const p=`/sites/${SITE}/drive/root:/${FILES}/${name}`;let it;
      if(blob.size<=3.5*1024*1024)it=await gx('PUT',`${p}:/content`,blob);
      else{const ses=await gx('POST',`${p}:/createUploadSession`,{item:{'@microsoft.graph.conflictBehavior':'fail'}});const N=5*320*1024;
        for(let o=0;o<blob.size;o+=N){const end=Math.min(blob.size,o+N);const r=await fetch(ses.uploadUrl,{method:'PUT',headers:{'Content-Range':`bytes ${o}-${end-1}/${blob.size}`},body:blob.slice(o,end)});if(!r.ok&&r.status!==202)throw new Error('파일을 올리지 못했어요 ('+r.status+')');if(end===blob.size)it=await r.json();}}
      return {id:it.id,url:'',contentType:blob.type||'',sizeBytes:blob.size};},
    async delete(id){try{await gx('DELETE',`/sites/${SITE}/drive/items/${id}`);}catch(e){if(e.status!==404)throw e;}},
    async list(){return {assets:[],usage:{}};}};
  async function blobFetch(id){
    const it=await gx('GET',`/sites/${SITE}/drive/items/${id}`);const url=it['@microsoft.graph.downloadUrl'];
    if(url){try{const r=await fetch(url);if(r.ok)return r;}catch{}}
    const drv=it.parentReference?.driveId;const r=await fetch(drv?`${G}/drives/${drv}/items/${it.id}/content`:`${G}/sites/${SITE}/drive/items/${id}/content`,{headers:{Authorization:'Bearer '+await token()}});
    if(!r.ok)throw new Error('download '+r.status);return r;}
  // 프로그램이 쓰는 '/_blob/<id>' 주소를 SharePoint 파일로 연결
  const _fetch=window.fetch.bind(window);
  window.fetch=async(u,o)=>{const s=typeof u==='string'?u:(u&&u.url)||'';const m=s.match(/\/_blob\/([^/?#]+)$/);if(m){await ready;const r=await blobFetch(decodeURIComponent(m[1]));return new Response(await r.blob(),{status:200,headers:{'content-type':r.headers.get('content-type')||'application/octet-stream'}});}return _fetch(u,o);};
  const BURL={};
  window.blobSrc=id=>{if(!id)return '';if(BURL[id]&&BURL[id]!=='loading')return BURL[id];
    if(!BURL[id]){BURL[id]='loading';(async()=>{try{await ready;const r=await blobFetch(id);BURL[id]=URL.createObjectURL(await r.blob());if(typeof render==='function')render();}catch(e){console.warn('이미지',id,e);BURL[id]=null;}})();}
    return 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';};
  const downloads={async save({filename,data}){const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}};
  window.__sendMail=async(to,subject,body)=>{to=[...new Set(to.filter(Boolean))];if(!to.length)return;await gx('POST','/me/sendMail',{message:{subject,body:{contentType:'Text',content:body},toRecipients:to.map(a=>({emailAddress:{address:a}}))},saveToSentItems:true});};
  window.__setAdmins=list=>{ADMINS=[...new Set([...SEED,...list.map(lower)])];};
  window.__diag=()=>({me:ME,admins:ADMINS,site:SITE,lists:LIDS,cache:cache.size,subs:subs.size});
  window.claude={async use(name){await ready;return {db,user,assets,downloads}[name]||null;}};

  /* ---------- 처음 설정 ---------- */
  async function createLists(btn){
    btn.disabled=true;const msg=document.querySelector('#m365gate .msgline');
    try{
      const cols=[{name:'Key',text:{},indexed:true,enforceUniqueValues:true},{name:'Coll',text:{},indexed:true},{name:'Data',text:{allowMultipleLines:true,textType:'plain'}},{name:'Stamp',number:{}},{name:'Yr',number:{},indexed:true},{name:'Q',text:{},indexed:true}];
      for(const n of LNAMES){if(LIDS[n])continue;msg.textContent=`목록 만드는 중… (${n})`;
        const l=await gx('POST',`/sites/${SITE}/lists`,{displayName:n,description:'재단 전자결재 데이터 (직접 고치지 마세요)',columns:cols,list:{template:'genericList'}},{scopes:SETUP_SCOPES});LIDS[n]=l.id;}
      msg.textContent='첨부 폴더 만드는 중…';
      try{await gx('POST',`/sites/${SITE}/drive/root/children`,{name:FILES,folder:{},'@microsoft.graph.conflictBehavior':'fail'});}catch(e){if(e.status!==409)throw e;}
      const cfg=await getOne('config/main');
      if(!cfg)await put('config/main',{admins:[ME.email]});
      gate('목록을 만들었어요',`<p>SharePoint에 전자결재 목록 ${LNAMES.length}개와 첨부 폴더(${FILES})를 만들었어요. 설치 안내의 <b>"목록 권한 설정"</b>을 마친 뒤 직원들이 쓰기 시작하면 돼요.</p>`,[['프로그램 열기',()=>{hideGate();readyRes();}]]);
    }catch(e){console.error(e);btn.disabled=false;msg.className='msgline err';msg.innerHTML=e.status===403?'목록을 만들 권한이 없어요. ① 지금 계정이 khf 사이트 <b>소유자</b>인지, ② Entra 앱의 API 사용 권한에 <b>Sites.Manage.All (위임)</b>이 추가되고 <b>관리자 동의</b>가 됐는지 확인해 주세요. (Graph 오류: '+esc(e.message)+')':'목록을 만들지 못했어요: '+esc(e.message);}}

  (async()=>{
    if(!A.clientId||!A.tenantId){gate('연결 정보가 필요해요','<p>파일 맨 위 APP_CONFIG를 확인해 주세요.</p>');return;}
    if(typeof msal==='undefined'){gate('로그인 모듈을 불러오지 못했어요','<p>파일을 다시 올려 주세요.</p>');return;}
    gate('불러오는 중…','<p>Microsoft 365에 연결하고 있어요.</p>');
    MS=new msal.PublicClientApplication({auth:{clientId:A.clientId,authority:`https://login.microsoftonline.com/${A.tenantId}`,redirectUri:A.redirectUri||location.origin+location.pathname},cache:{cacheLocation:'localStorage'}});
    await MS.initialize();
    const res=await MS.handleRedirectPromise().catch(e=>{console.error(e);return null;});
    ACC=res?.account||MS.getActiveAccount()||MS.getAllAccounts()[0]||null;
    if(!ACC){gate('재단 전자결재','<p>재단 Microsoft 365 계정(@kohem.org)으로 로그인해 주세요.</p>',[['Microsoft 365로 로그인',()=>MS.loginRedirect({scopes:SCOPES})]]);return;}
    MS.setActiveAccount(ACC);
    try{
      const me=await gx('GET','/me?$select=displayName,mail,userPrincipalName');
      ME={email:lower(me.mail||me.userPrincipalName),name:me.displayName||''};
      const site=await gx('GET',`/sites/${A.siteHost}:${A.sitePath}`);SITE=site.id;
      const ls=await gx('GET',`/sites/${SITE}/lists?$select=id,displayName&$top=500`);
      for(const l of ls.value)if(LNAMES.includes(l.displayName))LIDS[l.displayName]=l.id;
    }catch(e){console.error(e);
      gate('SharePoint에 연결하지 못했어요',`<p class="err">${e.status===403||e.status===404?'재단 사이트에 접근 권한이 없어요. 관리자에게 사이트 구성원으로 추가해 달라고 요청해 주세요.':esc(e.message)}</p>`,[['다시 시도',()=>location.reload()],['다른 계정으로 로그인',()=>MS.logoutRedirect(),true]]);return;}
    const missing=LNAMES.filter(n=>!LIDS[n]);
    if(missing.length){
      if(missing.length<LNAMES.length&&!missing.every(n=>n==='EA_Destroy'||n==='EA_Log')){gate('설정이 완전하지 않아요',`<p>전자결재 목록 일부(${missing.join(', ')})를 찾을 수 없어요. 관리자에게 SharePoint 목록 권한을 확인해 달라고 요청해 주세요.</p>`,[['다시 시도',()=>location.reload()]]);return;}
      if(missing.length===LNAMES.length){gate('처음 설정',`<p>전자결재 데이터를 담을 SharePoint 목록 ${LNAMES.length}개와 첨부 폴더를 만들고, 지금 계정(${esc(ME.email)})을 관리자로 지정해요. khf 사이트 <b>소유자</b> 계정으로 진행해 주세요.</p><p class="msgline"></p>`,[['목록 만들고 시작하기',b=>createLists(b)]]);return;}
    }
    try{const c=await getOne('config/main');if(c&&c.data&&Array.isArray(c.data.admins))window.__setAdmins(c.data.admins);}catch(e){console.error(e);}
    hideGate();readyRes();
  })();
})();

</script>

<style>
/* 업무 화면: 왼쪽 정렬 단일 열, 위에 탭, 문서는 흰 A4 종이로 보여준다. 휴가 관리와 같은 색·글꼴 체계 */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#18222F; --muted:#5B6878; --line:#D6DCE3;
  --accent:#1F5A70; --accent-soft:#DCEBF1; --accent-ink:#FFFFFF;
  --ok:#2C7A57; --ok-soft:#DDF0E6; --warn:#9A6A12; --warn-soft:#F7EBCF; --bad:#A93F38; --bad-soft:#F6DEDB;
  --cell:#E3E8ED; --seal:#C0392B;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-doc:"Nanum Myeongjo","Batang","AppleMyungjo",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151B; --surface:#182029; --ink:#E5EAF0; --muted:#98A4B2; --line:#2B3641;
    --accent:#72B6D2; --accent-soft:#1D3542; --accent-ink:#0C1A21;
    --ok:#6CC69E; --ok-soft:#173226; --warn:#E2B458; --warn-soft:#3A2E14; --bad:#E78C84; --bad-soft:#3C1E1B;
    --cell:#25303B; --seal:#E07A6E; color-scheme:dark;
  }
}

  --bg:#10151B; --surface:#182029; --ink:#E5EAF0; --muted:#98A4B2; --line:#2B3641;
  --accent:#72B6D2; --accent-soft:#1D3542; --accent-ink:#0C1A21;
  --ok:#6CC69E; --ok-soft:#173226; --warn:#E2B458; --warn-soft:#3A2E14; --bad:#E78C84; --bad-soft:#3C1E1B;
  --cell:#25303B; --seal:#E07A6E; color-scheme:dark;
}

.wrap{max-width:1180px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

function piiFindings(pairs){const out={block:[],warn:[]};
  for(const [lab,raw] of pairs){const s=String(raw??'');if(!s)continue;
    const re=/(?<![\d-])(\d{2})(\d{2})(\d{2})\s?-\s?([1-8])\d{6}(?![\d-])/g;let m;
    while((m=re.exec(s))){if(+m[2]>=1&&+m[2]<=12&&+m[3]>=1&&+m[3]<=31){out.block.push(`${lab}에 주민등록번호로 보이는 숫자`);break;}}
    if(PII_PHONE.test(s))out.warn.push(`${lab}에 휴대전화 번호`);
    const md=s.match(PII_MED);if(md)out.warn.push(`${lab}에 '${md[1]}'`);}
  out.warn=[...new Set(out.warn)];return out;}

function piiPairsOfDoc(d){const pairs=[];
  const walk=(v,lab)=>{if(v==null)return;if(typeof v==='string')pairs.push([lab,v]);else if(Array.isArray(v))v.forEach(x=>walk(x,lab));else if(typeof v==='object')for(const [k,x] of Object.entries(v))if(!PII_SKIP.has(k))walk(x,lab);};
  for(const [k,v] of Object.entries(d)){if(PII_SKIP.has(k)||k.startsWith('_'))continue;walk(v,k==='files'?'첨부파일 이름':k==='title'?'제목':'내용');}
  return pairs;}

let moUnsub=null;
const thisYm=()=>TODAY().slice(0,7);
const addMonths=(ym,n)=>{const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;};
const ymLabel=ym=>{const [y,m]=ym.split('-').map(Number);return `${y}년 ${m}월`;};
const moTitle=ym=>`${Number(ym.slice(5))}월 주요업무계획`;
const spaced=s=>[...String(s).replace(/\s/g,'')].join(' ');
const moCols=t=>t.two?[['g','구 분'],['when','시행예정']]:[['g','구 분'],['task','주요업무'],['detail','세부내용'],['when','시행예정']];
const moT=(t,x)=>t.two&&x&&x.fmt==='4'?{...t,two:false}:t;
const moFilled=r=>!!r&&['g','task','detail','when'].some(f=>String(r[f]||'').trim());
const moRowsOf=x=>Array.isArray(x?.rows)?x.rows.filter(moFilled):[];
const moState=y=>!y||!y.at||!Array.isArray(y.rows)?'미작성':y.submitted?(y.imported?'제출(PPT 이관)':'제출'):'작성 중';
const moTeam=id=>MO_TEAMS.find(t=>t.id===id)||MO_TEAMS[0];
function subscribeMonth(ym){if(S.moFor===ym||!S.db)return;S.moFor=ym;S.mo={};if(moUnsub)moUnsub();
  moUnsub=S.db.collection('mo').where('ym','==',ym).onSnapshot(snap=>{const m={};for(const x of snap.docs)m[x.data().dept]=x.data();S.mo=m;render();},e=>console.error(e));}
// 예전 방식(실적·계획 자유 입력)으로 저장된 보고: 같은 이름의 부서 기록을 찾아 참고로 보여 준다.
function moLegacy(t){for(const d of C().depts){if(!squash(d.name).includes(t.key))continue;const x=S.mo[d.id];if(x&&!Array.isArray(x.rows)&&(x.done||x.plan||x.issue||x.memo))return x;}return null;}
function myTeamId(){const t=squash(R(myKey())?.team||'');if(!t)return null;const f=MO_TEAMS.find(x=>t.includes(x.key));return f?f.id:null;}
// 내 팀 보고만 고칠 수 있다. 국(원)장 이상·관리자는 모든 팀. 명단의 팀이 4개 팀과 안 맞으면 막지 않는다.
function canEditTeam(id){const k=myKey();if(!k||S.readOnly)return false;if(S.isAdmin||lvl(k)>=2)return true;const mine=myTeamId();return !mine||mine===id;}
// 위 칸 이어받기: gv/tv는 비운 칸이 실제로 뜻하는 구분·주요업무
function moInherit(rows){let g='',t='';return rows.map((r,i)=>{const gg=String(r.g||'').trim(),tt=String(r.task||'').trim();if(i===0||gg){g=gg;t='';}if(tt)t=tt;return {...r,gv:g,tv:t};});}
// 병합 계산: gs/ts = 이 칸이 몇 줄을 차지하는지(0이면 위 칸에 합쳐짐)
function moLayout(rows){const out=rows.map(r=>({...r,g:String(r.g||'').trim(),task:String(r.task||'').trim(),gs:1,ts:1}));let gi=-1,ti=-1;
  out.forEach((r,i)=>{if(i===0||r.g)gi=i;else{out[gi].gs++;r.gs=0;}if(gi===i||r.task||ti<gi)ti=i;else{out[ti].ts++;r.ts=0;}});return out;}
function moTableEl(t,rows){const cols=moCols(t),L=moLayout(rows);
  const cg=t.two?['32%','68%']:['13%','21%','45%','21%'];
  return h('table',{class:'mo'},h('colgroup',{},cg.map(w=>h('col',{style:'width:'+w}))),h('tr',{},cols.map(([,l])=>h('th',{},l))),
    L.length?L.map(r=>h('tr',{},r.gs?h('td',{class:'c',rowspan:r.gs>1?r.gs:null},r.g):null,t.two?null:(r.ts?h('td',{class:'c',rowspan:r.ts>1?r.ts:null},r.task):null),t.two?null:h('td',{class:'c'},r.detail||''),h('td',{class:t.two?'':'c'},r.when||''))):h('tr',{},h('td',{colspan:cols.length,class:'c',style:'color:#888;height:12mm'},'작성 내용 없음')));}
function paperMonthly(ym){
  return h('div',{class:'paper mop'},h('div',{class:'ttl'},moTitle(ym)),h('div',{class:'no',style:'text-align:right'},`${ymLabel(ym)} · ${C().org.name}`),
    MO_TEAMS.map(t=>{const x=S.mo[t.id];return h('div',{class:'blk'},h('div',{class:'tm'},spaced(t.name),x&&x.at&&!x.submitted?h('span',{class:'wip'},'작성 중'):null),moTableEl(moT(t,x),moRowsOf(x)));}));}
async function monthlyXlsx(ym){const rows=[[],['',moTitle(ym)+' · '+ymLabel(ym)],[],['','팀','구 분','주요업무','세부내용','시행예정','상태']],merges=[{s:{r:1,c:1},e:{r:1,c:5}}];
  for(const t0 of MO_TEAMS){const x=S.mo[t0.id],t=moT(t0,x),rs=moInherit(moRowsOf(x)),r0=rows.length;
    if(!rs.length)rows.push(['',t.name,'','','','',moState(x)]);
    rs.forEach((r,i)=>rows.push(['',i?'':t.name,r.gv,t.two?'':r.tv,t.two?'':(r.detail||''),r.when||'',i?'':moState(x)]));
    if(rs.length>1){merges.push({s:{r:r0,c:1},e:{r:r0+rs.length-1,c:1}});merges.push({s:{r:r0,c:6},e:{r:r0+rs.length-1,c:6}});}}
  return xlsxSave(`월간업무보고_${ym}.xlsx`,[{name:ym,rows,merges,cols:[1,11,14,20,44,22,8]}]);}

/* 월간 PPT: 기존 보고서와 같은 4:3 (표지 → 팀별 → Thank you!) */
const blobToData=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(b);});
const imgSize=src=>new Promise(ok=>{const i=new Image();i.onload=()=>ok({w:i.naturalWidth,h:i.naturalHeight});i.onerror=()=>ok(null);i.src=src;});
const fitBox=(b,sz)=>{if(!sz||!sz.w||!sz.h)return b;const r=Math.min(b.w/sz.w,b.h/sz.h),w=sz.w*r,hh=sz.h*r;return {x:b.x+(b.w-w)/2,y:b.y+(b.h-hh)/2,w,h:hh};};
async function moLogos(){const L=C().moLogo;if(L&&L.id){try{const d=await blobToData(await blobOf(L));return {big:d,small:d,custom:true};}catch(e){console.error(e);}}return {big:MO_IMG.logo,small:MO_IMG.logoS,custom:false};}
// 줄 높이 어림: 칸 너비(인치)와 글자 수로 줄 수를 세어 한 장에 들어갈 만큼씩 나눈다.
function moChunks(t,rows){const cw=t.two?[3.39,5.43]:[1.1,1.89,3.94,1.89],fs=t.two?['gv','when']:['gv','tv','detail','when'];
  const hOf=r=>Math.max(...fs.map((f,i)=>String(r[f]||'').split('\n').reduce((a,l)=>a+Math.max(1,Math.ceil(l.length/(cw[i]*6.2))),0)))*0.2+0.12;
  const out=[[]];let used=0;const cap=5.0;for(const r of rows){const x=hOf(r);if(used+x>cap&&out[out.length-1].length){out.push([]);used=0;}out[out.length-1].push(r);used+=x;}return out;}

async function loadProfiles(){if(!S.user)return;const ids=new Set([S.me,...Object.keys(S.links),...Object.values(C().roster).map(x=>x.uid).filter(Boolean)].filter(Boolean));const need=[...ids].filter(u=>!S.PS[u]);if(!need.length)return;try{const ps=await S.user.profiles(need);Object.assign(S.PS,ps);}catch(e){console.error(e);}}
let autoLinked=false;
async function autoLink(){if(autoLinked||!S.me||S.readOnly||!S.ready.cfg||!S.ready.links||myKey()||S.links[S.me]?.key)return;const nm=S.myName||S.PS[S.me]?.name;if(!nm)return;
  const hits=Object.keys(C().roster).filter(k=>squash(R(k).name)===squash(nm)&&!R(k).uid);if(hits.length!==1)return;autoLinked=true;
  try{await serial('link',()=>S.db.doc('links/'+S.me).set(clone({...(S.links[S.me]||{}),key:hits[0],at:Date.now()})));}catch(e){console.error(e);}}

function routeHash(){const h0=(location.hash||'').slice(1);if(h0.startsWith('doc-')){S.open=h0.slice(4);}else if(TABS.some(t=>t[0]===h0)){S.tab=h0;S.open=null;}}

(async()=>{
  routeHash();render(true);

  if(!db){notice('저장소에 연결하지 못했어요. claude.ai에 로그인한 상태로 이 페이지를 열어 주세요.');$('who').textContent='';S.readOnly=true;return;}
  S.db=db;S.user=user;try{S.assets=await claude.use('assets');}catch{S.assets=null;}
  if(user){try{const me=await user.me();S.me=me.id;S.myName=me.name||'';S.isAdmin=!!me.canEdit;if((await user.can('data.write'))===false)S.readOnly=true;}catch(e){console.error(e);}}
  if(!S.me){S.readOnly=true;notice('로그인한 직원 정보가 없어 보기만 할 수 있어요.');}
  else if(S.readOnly)notice('보기 전용 권한이라 결재할 수 없어요. 관리자에게 기여자(Contributor) 이상으로 공유해 달라고 요청하세요.');
  const onErr=e=>{console.error(e);if(e?.code==='revoked'){S.readOnly=true;soon();}};
  let adminAdded=false;
  db.doc('config/main').onSnapshot(s=>{S.cfg=s.exists?s.data():{};S.ready.cfg=true;if(window.__setAdmins)window.__setAdmins(S.cfg.admins||[]);
    if(S.isAdmin&&S.me&&!S.readOnly&&!adminAdded&&!(S.cfg.admins||[]).includes(S.me)){adminAdded=true;writeConfig(c=>{c.admins=[...new Set([...(c.admins||[]),S.me])];}).catch(console.error);}loadProfiles().then(()=>{autoLink();soon();});},onErr);
  let linksReady;const linksP=new Promise(r=>linksReady=r);
  db.collection('links').onSnapshot(s=>{const m={};for(const x of s.docs)m[x.id]=x.data();S.links=m;S.ready.links=true;linksReady();loadProfiles().then(()=>{autoLink();soon();});},onErr);
  db.collection('dec').onSnapshot(s=>{const m={};for(const x of s.docs)m[x.id]=x.data();S.dec=m;soon();},onErr);
  const Y=new Date().getFullYear();
  db.collection('nos').where('yr','>=',Y-1).onSnapshot(s=>{const m={};for(const x of s.docs)m[x.id]=x.data();S.nos=m;soon();},onErr);
  if(S.me){await linksP;try{await initKeys();}catch(e){console.error(e);notice('문서를 여는 암호 키를 준비하지 못했어요. 페이지를 새로 고쳐 주세요.');}}
